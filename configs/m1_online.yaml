# M1 online policy: exact rank cost model plus communication-aware one-shot proxy.
compute:
  expert_weight_bytes: 134217728
  expert_memory_bandwidth_gb_per_s: 3000.0

network:
  use_rank_critical_path: true

scheduler:
  name: joint
  max_wait_ms: 100.0
  locality_weight: 0.25
  locality_benefit_ms: 0.25
  deadline_weight_ms: 0.25
  kv_fragmentation_weight_ms: 0.10
  progress_fragmentation_weight_ms: 1.0
  base_overhead_ms: 0.002
  candidate_evaluation_overhead_ms: 0.0002
  proxy_evaluation_overhead_ms: 0.0
  candidate_pool_size: null
  full_evaluation_shortlist_size: 1
  one_shot_proxy_batch: true
  proxy_activation_mode: communication_bound
  proxy_bandwidth_threshold_gb_per_s: 100.0
  proxy_latency_threshold_ms: 0.02
